[project]
name = "envkit"
version = "0.1.0"
description = "Environment-agnostic backend for agent evaluation: windowed engine, MCP server, calibrated scoring, Harbor task generator."
requires-python = ">=3.11"
# The engine, scorer and verifier use the standard library only. These two are
# needed for the MCP server and for policies that play over MCP.
dependencies = [
    "mcp==2.3.0",
    "uvicorn>=0.31.1",
]

[project.scripts]
envkit = "envkit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envkit", "envs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
