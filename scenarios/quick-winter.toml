# Greenhouse Bench, quick version: the same game, data and scoring as normal-winter,
# cut to two weeks and 60 tool calls so one model run takes about 10-20 minutes.
# Shorter does not work: below 14 days or 60 calls the reference's investments do not pay
# off before the end, and it no longer beats doing nothing (measured on seed 1).
# Use it to benchmark a model fast (scripts/benchmark.sh); normal-winter is the full task.
# Format: src/envkit/scenario.py. Data files: docs/GREENHOUSE_SPEC.md section 3.

[task]
id = "quick-winter"
title = "Greenhouse Bench (quick): run a winter greenhouse facility for 14 days"
env = "greenhouse.env:GreenhouseBench"
benchmark = true          # calibrated at run time; kept out of the quick checks
# Development seeds. Evaluation seeds 101-108 use separate recorded weather and price
# windows and are run with `--seeds`; nothing is tuned on them.
seeds = [1, 2, 3]
reference = "reference"
prompt = """
You run a commercial greenhouse facility in the Netherlands for ${horizon_days} winter days.

One energy centre (a gas CHP, a gas boiler, a heat buffer, a CO2 store and a grid
connection) serves two compartments. Compartment A grows butterhead lettuce and
compartment B grows basil, each in several batches of different ages. You also run the
business: you order CO2 and seedlings, which arrive days later; you hire and release
staff; and planting, harvesting and repairs use your crew's worker-hours.

Your goal is the highest net profit in EUR at the end of the last hour: harvest revenue
plus electricity sold, minus gas, electricity bought, CO2, wages, hiring, repairs and
orders. Crop still standing at the end is worth nothing.

How it works:
- Call `get_rules` first. It holds every mechanism, formula, price, lead time, crop rule
  and event rate, and the published ranges of the facility parameters you are not told.
- Simulated time moves only when you call `advance(hours)`. Every other tool is free in
  simulated time and never moves the clock.
- Climate and energy settings stand until you change them. The facility starts on
  baseline settings that nobody has tuned.
- You have ${max_calls} tool calls in total, reads included. When they are used up, or when
  you call `finish_episode`, the remaining hours run with your last settings and nobody
  acting: nothing more is ordered, planted or harvested.
- The episode lasts ${windows} hours. Plan the whole horizon: several decisions only pay off
  days later, and some cannot be made late.
"""

[shift]
windows = 336             # 14 days x 24 hours
window_hours = 1
ops_per_window = 1        # only `advance` costs an operation
max_calls = 60            # 10-20 minutes, depending on the model

[env]
facility = "data/facilities/nl_two_compartment.toml"
climate = "data/climates/nl_january.toml"
energy_prices = "data/energy_prices/nl_winter.toml"
market = "data/markets/nl_winter.toml"
crops = ["data/crops/lettuce_butterhead.toml", "data/crops/basil_genovese.toml"]
events = ["data/events/late_delivery.toml", "data/events/boiler_trip.toml"]
horizon_days = 14

# One number: net profit. 0 is what happens when nobody acts; the reference planner sits
# at 0.8, which leaves headroom above it.
[[scoring.components]]
name = "profit"
weight = 1.0
kind = "anchored"
metric = "profit_eur"
zero_anchors = ["do-nothing", "absentee"]
top_anchors = ["reference"]
target = 0.8

# The rest of the ladder (spec 9), recorded in calibration.json next to the anchors.
[calibration]
anchors = [
  "naive", "rule-based",
  "exploit:harvest-early", "exploit:cut-heat-late", "exploit:chp-flat-out", "exploit:extreme-climate",
  "exploit:spam-repairs", "exploit:spam-orders", "exploit:plant-late", "exploit:never-harvest",
]

[audit]
# Reads and the clock decide nothing: a reference run cut off before only these calls
# may tie the full run.
clock_tools = ["advance", "get_status", "get_batches", "get_forecast", "get_history", "get_rules"]

[harbor]
agent_timeout_sec = 1800    # 30 min: a safety net; a run needs 10-20
verifier_timeout_sec = 600
