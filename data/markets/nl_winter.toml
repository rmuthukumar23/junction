# Market for a Dutch greenhouse in January. Owner: Rowan.
# Energy prices (gas, electricity, export) are in data/energy_prices/nl_winter.toml.
# Values are rounded, illustrative figures anchored on the sources named next to them,
# not a costing of a real farm. Sources were read on 2026-11-14.
schema = "market/1"
id = "nl_winter"

# Working capital at hour 0. Only the change in cash is scored; this only has to be
# large enough that the episode never needs credit.
start_cash_eur = 50000.0

[crops.lettuce_butterhead]
# Per head. Dutch greenhouse butterhead has traded around EUR 0.30 per head in weak
# markets (FreshPlaza, "Greenhouse lettuce demand and prices fluctuate") and around
# EUR 0.50 in good ones (FreshPlaza, "Scandinavia and the Middle East in the market for
# Dutch greenhouse lettuce"). Winter supply is short, so the upper half.
price_eur_per_unit = 0.45

[crops.basil_genovese]
# Per kg. Fresh basil wholesale in Europe ranges widely; Spain about USD 8/kg in
# 2023-2024 (Tridge, fresh basil leaf Spain). The spec's example override uses 9.0.
price_eur_per_unit = 8.0

[co2]
# The external CO2 contract the energy centre can dose from, per kg, metered hourly.
# European merchant CO2 was about USD 0.29/kg in Q1 2026 (Expert Market Research,
# carbon dioxide price trends). Contract supply is dearer than a bulk tank delivery.
external_price_eur_per_kg = 0.32

[items.co2_kg]
# Liquid CO2 delivered into the facility's tank (the facility file holds its size, start
# level and low-store alarm). Charged on delivery.
category = "co2"
price_eur_per_unit = 0.25          # bulk delivery, below the contract price above
lead_time_h = 72                   # three days from order to tank (spec test: hour 10 -> 82)
min_quantity = 2000.0              # kg; one road tanker part-load
dispatch_h = 12                    # cancellable until the supplier dispatches
cancel_fee_eur = 150.0

[items."seedlings:lettuce_butterhead"]
# Per plant (a propagated plug ready to transplant). Plug prices are a few cents each;
# the crop file's planting density turns area into plants.
category = "seedlings"
price_eur_per_unit = 0.08
lead_time_h = 120                  # five days: the propagator ships from stock
min_quantity = 5000.0
dispatch_h = 24
cancel_fee_eur = 200.0

[items."seedlings:basil_genovese"]
# Per plant.
category = "seedlings"
price_eur_per_unit = 0.10
lead_time_h = 120
min_quantity = 5000.0
dispatch_h = 24
cancel_fee_eur = 200.0

[staff]
# Employer cost per paid worker-hour. The 2026 Dutch statutory minimum is EUR 14.71/h
# (age 21+) and greenhouse workers typically earn EUR 14.71-18.00/h (NLnest, "Work in a
# greenhouse", 2026); employer charges and agency margin bring the cost to about 22.
wage_eur_per_worker_hour = 22.0
shift_start_h = 7
shift_hours = 8                    # each worker gives 8 worker-hours a day
start_crew = 3
max_crew = 10
hiring_fee_eur = 400.0             # agency placement fee per worker
hire_notice_days = 3               # an agency worker starts three days after the request
release_notice_days = 7            # paid for a week after release

[start_stock]                      # the CO2 store's start level is in the facility file
"seedlings:lettuce_butterhead" = 0.0
"seedlings:basil_genovese" = 0.0
