# Genovese basil, repeated cuts, sold per kg.
#
# Same leafy_vanhenten model as lettuce: basil is also a vegetative leafy C3 crop harvested
# for its leaves, so canopy photosynthesis minus maintenance respiration is a fair basis.
# No basil-specific parameterisation of this model is known to us, so the leaf-level
# coefficients are Van Henten's lettuce values; the temperature response, dry matter,
# targets, stress and calibration are basil's own.
#
# Sources (cited per value below by their tag):
#   [VH94]  Van Henten, E.J. (1994). Greenhouse climate management: an optimal control
#           approach. PhD thesis, Wageningen University.
#   [VS10]  van Straten, G. et al. (2010). Optimal Control of Greenhouse Cultivation. CRC Press, ch. 6.
#   [BvM]   Boersma, S. and van Mourik, S. WUR, edepot.wur.nl/693301 (same parameter set as [VH94]).
#   [USDA]  USDA FoodData Central, "Spices, basil, fresh": water 92.06 g per 100 g.
#   [DOU]   Dou, H., Niu, G., Gu, M. and Masabni, J.G. (2018). Responses of sweet basil to
#           different daily light integrals in photosynthesis, morphology, yield, and
#           nutritional quality. HortScience 53(4): 496-503 (yield rises with DLI over about 9-19).
#   [MCR]   Thimijan, R.W. and Heins, R.D. (1983). HortScience 18: 818-822 (4.57 umol per J).
#   [CAL]   Calibrated in tests/greenhouse/test_crop_files.py so a batch under the target
#           climate below is ready in nominal_days.
#   [DES]   Design value for the benchmark: plausible, not a single published number. Basil is
#           a warm-season crop with an optimum in the mid-20s C that is damaged by chilling
#           below about 10 C; the values marked [DES] encode that.

schema = "crop/1"
id = "basil_genovese"
name = "Genovese basil"
growth_model = "leafy_vanhenten"

[cycle]
harvest_mode = "repeated"
nominal_days = 28                  # [DES] transplant -> first cut
min_days_before_end = 28           # [DES]
ready_fresh_weight_g = 80          # [DES] per plant at a cut
regrow_fraction = 0.25             # [DES] cut above the lowest nodes, leaving about a quarter of the plant
regrow_days = 12                   # [CAL] cut -> ready again under the target climate (model result: 11.9 days)
max_cuts = 3                       # [DES] stems get woody and yield falls after a few cuts

[planting]
density_per_m2 = 25                # [DES]
transplant_dry_weight_g = 0.1      # [DES] about 1.3 g fresh at the dry-matter fraction below
seedling_cost_eur = 0.06           # [DES] per plant
plant_worker_hours_per_1000 = 1.5  # [DES] as lettuce
harvest_worker_hours_per_1000 = 4.0 # [DES] cutting by hand is slower than lifting a head

[growth]                           # leafy_vanhenten parameters; symbols from [VH94]
dry_matter_fraction = 0.0794       # [USDA] 1 - 92.06/100
yield_factor = 0.544               # c_alpha_beta [VH94][VS10][BvM]
light_use_efficiency_kg_j = 17.0e-9 # c_epsilon [VH94][VS10][BvM]
radiation_j_per_umol = 0.2188      # [MCR] 1/4.57: crop-level PAR read as W m-2 of PAR
canopy_closure_m2_kg = 10.0        # c_pl,d, 53 in [VH94]; see the lettuce file for why. [CAL] first cut at 27.6 days
boundary_conductance_m_s = 0.007   # g_bnd [VH94][VS10][BvM]
stomatal_conductance_m_s = 0.005   # g_stm [VH94][VS10][BvM]
carboxylation_conductance_max_m_s = 1.959e-3   # peak of [VH94]'s g_car, as lettuce
# Warm-season shape: no growth below 8 C, optimum 27 C, none above 40 C. [DES]
temperature = { curve = "cardinal", t_min = 8.0, t_opt = 27.0, t_max = 40.0 }
co2_kg_m3_per_ppm = 1.8295e-6      # ideal gas, CO2 0.04401 kg mol-1 at 20 C and 101.325 kPa
co2_saturation_ppm = 1200.0        # [DES] as lettuce: no reward for extreme enrichment
co2_compensation_kg_m3 = 5.2e-5    # c_Gamma [VH94][VS10][BvM]
co2_compensation_q10 = 2.0         # [VH94]
co2_compensation_ref_c = 20.0      # [VH94]
respiration_dry_per_s = 2.65e-7    # c_resp,d [VH94][VS10][BvM]
respiration_co2_per_s = 4.87e-7    # c_resp,c [VH94][VS10][BvM]
respiration_q10 = 2.0              # [VH94]
respiration_ref_c = 25.0           # [VH94]

[growth.transpiration]             # [VH94][VS10][BvM]
canopy_conductance_m_s = 3.6e-3
vapour_c1_j_m3 = 9348.0
gas_constant_j_kmol_k = 8314.0
celsius_to_kelvin = 273.15
vapour_c2 = 17.4
vapour_c3_c = 239.0

[climate_targets]                  # advice published to the agent; nominal_days holds at the midpoints
day_temp_c = [23, 27]              # [DES]
night_temp_c = [18, 22]            # [DES]
co2_ppm = [800, 1000]              # [DES]
dli_mol_m2_d = [14, 18]            # [DOU]
rh_pct = [60, 80]                  # [DES]
photoperiod_h = 16                 # [DES]

[stress]                           # each counter adds curve(signal) per day; quality = 1 - sum of counters
chilling = { signal = "temp_min", curve = "linear_below", threshold = 10.0, rate = 0.04 }     # [DES] per C below
heat     = { signal = "temp_day_mean", curve = "linear_above", threshold = 32.0, rate = 0.02 } # [DES] per C above
frost_kill_c = 0.0                 # [DES] basil does not survive freezing
ready_loss_per_day = 0.02          # [DES] leaves toughen and flower buds form when a cut is late

[market]
unit = "kg"
min_sellable = { fresh_weight_g = 20 }   # [DES] per plant per cut
grades = [ { name = "A", min_quality = 0.85, price_factor = 1.0 },   # [DES]
           { name = "B", min_quality = 0.60, price_factor = 0.6 },
           { name = "waste", min_quality = 0.0, price_factor = 0.0 } ]

[estimate]                         # what get_batches shows
weight_rel_sigma = 0.10            # [DES] harder to judge than a head
quality_sigma = 0.03               # [DES]
