# Butterhead lettuce, single cut, sold per head.
#
# Sources (cited per value below by their tag):
#   [VH94]  Van Henten, E.J. (1994). Greenhouse climate management: an optimal control
#           approach. PhD thesis, Wageningen University. The one-state lettuce model.
#   [VS10]  van Straten, G., van Willigenburg, G., van Henten, E., van Ooteghem, R. (2010).
#           Optimal Control of Greenhouse Cultivation. CRC Press, chapter 6 (parameter table of [VH94]).
#   [BvM]   Boersma, S. and van Mourik, S. Nonlinear sample-based MPC in a greenhouse with
#           lettuce and uncertain weather forecasts. WUR, edepot.wur.nl/693301 (same parameter set).
#   [USDA]  USDA FoodData Central, "Lettuce, butterhead (includes boston and bibb types), raw":
#           water 95.63 g per 100 g.
#   [CEA]   Brechner, M. and Both, A.J. Cornell Controlled Environment Agriculture,
#           Hydroponic Lettuce Handbook: DLI 17 mol m-2 d-1 target, above which tipburn rises.
#   [MCR]   Thimijan, R.W. and Heins, R.D. (1983). Photometric, radiometric and quantum light
#           units of measure. HortScience 18: 818-822 (sunlight PAR: 4.57 umol per J).
#   [CAL]   Calibrated in tests/greenhouse/test_crop_growth.py so a batch under the target
#           climate below is ready in nominal_days. See the note on canopy_closure_m2_kg.
#   [DES]   Design value for the benchmark: no single published number; chosen to be
#           plausible and to make the decision matter. Changing it is a data change only.

schema = "crop/1"
id = "lettuce_butterhead"
name = "Butterhead lettuce"
growth_model = "leafy_vanhenten"

[cycle]
harvest_mode = "single"
nominal_days = 21                  # [DES] pinned in docs/CROPS.md: DLI 17 with CO2; [CEA] gives 24, grower guides 21-28
min_days_before_end = 21           # [DES] same as the cycle (docs/CROPS.md)
ready_fresh_weight_g = 250         # [DES] a typical marketable butterhead head (about 250-300 g)

[planting]
density_per_m2 = 20                # [DES] spec 3.1; common butterhead spacing
transplant_dry_weight_g = 0.175    # [VH94] initial state 3.5 g DW m-2 at 20 plants m-2 (about 4 g fresh, a plug plant)
plant_worker_hours_per_1000 = 1.5  # [DES] spec 3.1
harvest_worker_hours_per_1000 = 3.0 # [DES] spec 3.1

[growth]                           # leafy_vanhenten parameters; symbols from [VH94]
dry_matter_fraction = 0.0437       # [USDA] 1 - 95.63/100
yield_factor = 0.544               # c_alpha_beta [VH94][VS10][BvM]
light_use_efficiency_kg_j = 17.0e-9 # c_epsilon [VH94][VS10][BvM]
radiation_j_per_umol = 0.2188      # [MCR] 1/4.57: crop-level PAR read as W m-2 of PAR
# c_pl,d is 53 m2 kg-1 in [VH94]. With that value a 4 g plug reaches 250 g in about 9 days
# under the target climate (initial relative growth rate near 1 per day, against about
# 0.2-0.35 measured for lettuce). Only this coefficient is calibrated: it sets how fast the
# young canopy closes, while the full-canopy rate and all light, CO2 and temperature
# responses keep the published values. [CAL]
canopy_closure_m2_kg = 17.4            # [CAL] gives 20.7 days under the target midpoints
boundary_conductance_m_s = 0.007   # g_bnd [VH94][VS10][BvM]
stomatal_conductance_m_s = 0.005   # g_stm [VH94][VS10][BvM]
# g_car = -5.11e-6 T^2 + 2.3e-4 T - 6.29e-4 m s-1 in [VH94][VS10][BvM]. That parabola is
# exactly its peak (1.959e-3 at 22.50 C) times a cardinal curve with t_min and t_max at its
# roots (2.925 and 42.085 C), whose shape exponent is then 1.
carboxylation_conductance_max_m_s = 1.959e-3
temperature = { curve = "cardinal", t_min = 2.925, t_opt = 22.505, t_max = 42.085 }
co2_kg_m3_per_ppm = 1.8295e-6      # ideal gas, CO2 0.04401 kg mol-1 at 20 C and 101.325 kPa
# [VH94]'s rectangular hyperbola keeps rising with CO2 (about 19% more assimilation at 2000
# than at 1000 ppm here), which would reward extreme enrichment. Growers rarely dose above
# 1000-1200 ppm because the gain is small. Above this level CO2 adds nothing. [DES]
co2_saturation_ppm = 1200.0
co2_compensation_kg_m3 = 5.2e-5    # c_Gamma [VH94][VS10][BvM]
co2_compensation_q10 = 2.0         # [VH94]
co2_compensation_ref_c = 20.0      # [VH94]
respiration_dry_per_s = 2.65e-7    # c_resp,d [VH94][VS10][BvM]
respiration_co2_per_s = 4.87e-7    # c_resp,c [VH94][VS10][BvM]
respiration_q10 = 2.0              # [VH94] 2^(0.1 T - 2.5)
respiration_ref_c = 25.0           # [VH94]

[growth.transpiration]             # [VH94][VS10][BvM]
canopy_conductance_m_s = 3.6e-3    # c_v,pl,ai
vapour_c1_j_m3 = 9348.0            # c_v,1
gas_constant_j_kmol_k = 8314.0     # c_R
celsius_to_kelvin = 273.15         # c_T
vapour_c2 = 17.4                   # c_v,2
vapour_c3_c = 239.0                # c_v,3

[climate_targets]                  # advice published to the agent; nominal_days holds at the midpoints
day_temp_c = [16, 22]              # [DES] spec 3.1
night_temp_c = [12, 18]            # [DES] spec 3.1
co2_ppm = [800, 1000]              # [DES] spec 3.1
dli_mol_m2_d = [12, 17]            # [CEA] upper end 17
rh_pct = [70, 85]                  # [DES] common greenhouse humidity band for lettuce
photoperiod_h = 16                 # [DES] typical lit winter production

[stress]                           # each counter adds curve(signal) per day; quality = 1 - sum of counters
tipburn = { signal = "dli_excess", curve = "linear_above", threshold = 17.0, rate = 0.01 }    # [CEA] threshold; [DES] rate per mol above
bolting = { signal = "temp_day_mean", curve = "linear_above", threshold = 24.0, rate = 0.01 } # [DES] per C above
cold    = { signal = "temp_min", curve = "linear_below", threshold = 4.0, rate = 0.05 }      # [DES] per C below
frost_kill_c = -1.0                # [DES] spec 3.1
# D5: a ready head left standing loses quality at this rate. With the grades below it stays
# grade A for 5 days, is grade B until day 13, and sells for nothing (waste) after about 13.3
# days. No published per-day rate was found. Delayed harvest is reported to lower butterhead
# quality (hydroponic harvest-stage study, redalyc.org/pdf/908/90842183011.pdf),
# and overmature heads turn tough, bitter and bolt, which growers treat as unmarketable. [DES]
ready_loss_per_day = 0.03

[market]
unit = "head"
min_sellable = { fresh_weight_g = 150 }   # [DES] spec 3.1; blocks harvesting everything early
grades = [ { name = "A", min_quality = 0.85, price_factor = 1.0 },   # [DES] spec 3.1
           { name = "B", min_quality = 0.60, price_factor = 0.6 },
           { name = "waste", min_quality = 0.0, price_factor = 0.0 } ]

[estimate]                         # what get_batches shows
weight_rel_sigma = 0.08            # [DES] visual weight estimate
quality_sigma = 0.03               # [DES]
