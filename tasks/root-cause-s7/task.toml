schema_version = "1.4"

# The only evidence the verifier receives: the action log written by the
# simulation sidecar. Nothing is taken from the agent's container.
artifacts = [
    { source = "/var/lib/envkit/trace.jsonl", service = "sim" },
]

[task]
name = "junction/root-cause-s7"
description = "Root Cause: greenhouse operations"
keywords = ["envkit", "mcp", "simulation"]

[metadata]
scenario = "root-cause"
seed = 7
bundle = "6bd5004b21948f40"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0

[[environment.mcp_servers]]
name = "greenhouse"
transport = "streamable-http"
url = "http://sim:8000/mcp"
