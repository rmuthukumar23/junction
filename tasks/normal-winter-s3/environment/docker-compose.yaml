# Merged on top of Harbor's base compose file, which defines `main`.
services:
  main:
    depends_on:
      sim:
        condition: service_healthy

  # The world. It is reachable from `main` only on the MCP port.
  sim:
    build:
      context: ./sim
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
