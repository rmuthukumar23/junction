# A supplier runs late: the open order due soonest arrives later than promised.
# Owner: Rowan. Illustrative values. If no order is open when it fires, nothing happens
# (the schedule is fixed per seed; only its effect depends on what is on order).
schema = "event/1"
id = "late_delivery"
kind = "late_delivery"
rate_per_day = 0.08                 # published
delay_h = {min = 12, max = 60}      # published as a range; the drawn value is hidden
signal = "alarm"
items = ["co2_kg"]                  # which orders it can delay; [] = any
pinned_hours = []
