# Speed-run smoke test: catches breaking changes, not a benchmark. One simulated day,
# a few tool calls, the same facility, crops, market and events as normal-winter.toml. A model run on it
# checks the whole chain (task build, Harbor, MCP tool schemas, the agent, replay,
# the verifier) in minutes. The submitted task is normal-winter.toml (42 days).
#
# Faked values: the start batches are old enough to be ready on day 1, so harvesting
# is exercised too.

[task]
id = "smoke"
title = "LettuceBench smoke run"
env = "greenhouse.env:GreenhouseBench"
seeds = [1]
reference = "reference"
prompt = """
Smoke test of a greenhouse simulator. You run a three-compartment winter greenhouse
for ${horizon_days} day (${windows} one-hour windows) with ${max_calls} tool calls.
You take one turn a day at 06:00: one submit_day call with up to ${actions_per_day}
actions. Below is the morning briefing. Call submit_day with two actions: a harvest
with the ids of every batch whose status is "ready", and a set_night_schedule with
from_hour=18 and copy_day=true. Then call submit_day with no actions until the
episode is done.
"""

[shift]
windows = 24
window_hours = 1
ops_per_window = 1
max_calls = 12

[env]
facility = "data/facilities/nl_three_compartment.toml"
climate = "data/climates/nl_january.toml"
energy_prices = "data/energy_prices/nl_winter.toml"
market = "data/markets/nl_winter.toml"
crops = ["data/crops/lettuce_butterhead.toml", "data/crops/broccoli_micro.toml", "data/crops/radish_micro.toml"]
events = ["data/events/boiler_trip.toml", "data/events/late_delivery.toml", "data/events/storm.toml"]
news = ["data/news/storm.toml", "data/news/frost.toml", "data/news/gas_price.toml"]
horizon_days = 1
actions_per_day = 5

[env.overrides]
"facility.compartments.A.start_batches" = [{age_days = 13, area_fraction = 0.5}, {age_days = 0, area_fraction = 0.5}]
"facility.compartments.B.start_batches" = [{age_days = 13, area_fraction = 0.5}, {age_days = 0, area_fraction = 0.5}]
"facility.compartments.C.start_batches" = [{age_days = 9, area_fraction = 0.5}, {age_days = 0, area_fraction = 0.5}]

# The score only shows that the agent reached the tools: the share of hours in which
# it acted (do-nothing = 0). Profit is in the ledger but not scored here.
[[scoring.components]]
name = "acted"
weight = 1.0
kind = "mean"
metrics = ["continuity"]

[harbor]
agent_timeout_sec = 300
