schema_version = "1.4"

# The only evidence the verifier receives: the action log written by the
# simulation sidecar. Nothing is taken from the agent's container.
artifacts = [
    { source = "/var/lib/envkit/trace.jsonl", service = "sim" },
]

[task]
name = "junction/smoke-s1"
description = "Greenhouse Bench smoke run"
keywords = ["envkit", "mcp", "simulation"]

[metadata]
scenario = "smoke"
seed = 1
bundle = "d85b2d6b367d6d4c"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 300.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "env"
transport = "streamable-http"
url = "http://sim:8000/mcp"
