schema_version = "1.4"

# The only evidence the verifier receives: the action log written by the
# simulation sidecar. Nothing is taken from the agent's container.
artifacts = [
    { source = "/var/lib/envkit/trace.jsonl", service = "sim" },
]

[task]
name = "junction/normal-winter-s2"
description = "LettuceBench: run a winter greenhouse facility for 42 days"
keywords = ["envkit", "mcp", "simulation"]

[metadata]
scenario = "normal-winter"
seed = 2
bundle = "4dd00065f99002c1"

[agent]
timeout_sec = 10800.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "env"
transport = "streamable-http"
url = "http://sim:8000/mcp"
